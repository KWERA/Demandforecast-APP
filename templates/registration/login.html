{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width: 420px;">
    <h3>Log in</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
